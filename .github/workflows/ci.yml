name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  # Analyze + unit tests + the release build. The release build is the gate
  # that matters most: `patrol` sat in dev_dependencies for months emitting a
  # plugin registration that only a release build fails on, so analyze and
  # test both stayed green while the APK could not be cut at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Release build (runs R8)
        run: flutter build apk --release

  # Goldens are renderer-sensitive; keep their macOS image fixed. Run only the
  # golden file so this job does not repeat the full suite in `check`.
  goldens:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Goldens
        run: flutter test test/control_golden_test.dart --tags golden --run-skipped

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: "**/failures/**"
          if-no-files-found: ignore
