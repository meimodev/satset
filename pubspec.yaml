name: satset
description: "SatSet — Solusi Cepat, Kerja Akurat. Internal ordering ecosystem."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.0
  path: ^1.9.0

  # Models / codegen runtime
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Persistence (server-side)
  #
  # `drift` is pinned exact, not caret-ranged. drift_dev 2.34.1+ requires
  # analyzer ^13 and freezed 3.2.5 caps analyzer at 12, so the toolchain can
  # only sit at drift_dev 2.34.0 — and drift_dev 2.34.0's migration verifier is
  # written against drift 2.34.0's `drift3_preview` surface. Let drift float to
  # 2.34.3 and `test/schema_migration_test.dart` stops compiling, which is a
  # confusing way to learn that two packages from the same author disagree.
  # Unpin once freezed supports analyzer 13.
  drift: 2.34.0
  # Direct, not transitive, because it replaced a direct dependency:
  # `sqlite3_flutter_libs` is EOL (its last release is literally `0.6.0+eol`,
  # description "Not used anymore"). sqlite3 3.x builds the native library
  # itself through Dart's native-asset hooks, so `libsqlite3.so` reaches the
  # APK without a Flutter plugin in between — verified in the release APK for
  # all three ABIs, which is the only place this can be checked.
  sqlite3: ^3.4.0
  path_provider: ^2.1.4

  # LAN transport
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Storage / prefs
  # Deliberately v10, not v11, and this is a two-release migration rather than
  # a stale pin. v11 REMOVES the ciphers v9 wrote with (RSA/PKCS1 and
  # AES-CBC/PKCS7); v10 is the release that migrates them to OAEP and AES-GCM.
  # Going 9 -> 11 in one step leaves everything this store holds unreadable on
  # every device already in the field: the session JWT, the device id, the
  # device cert/key PEMs, and the server fingerprint that IS the pairing trust
  # anchor (ADR-0080). That is not a logout, it is a re-pair of every handset
  # and tablet in every venue, and nothing in the app would report why.
  #
  # So: ship v10, let it migrate on first launch, and raise this to ^11 in a
  # LATER release once the fleet has run v10 at least once.
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2

  # Discovery / pairing
  bonsoir: ^7.1.0

  # TLS / JWT / crypto
  basic_utils: ^5.8.2
  dart_jsonwebtoken: ^3.4.1
  crypto: ^3.0.5
  # Already here transitively (dart_jsonwebtoken). Named directly for
  # PBKDF2 in lib/server/pin.dart — see ADR-0112.
  pointycastle: ^4.0.0

  # Logging
  logging: ^1.2.0

  # Audio alerts
  audioplayers: ^6.1.0
  image_picker: ^1.2.2
  # Decode/downscale the venue logo JPEG for ESC/POS raster (ADR-0033).
  image: ^4.3.0

  # Export (report / order history) — CSV/PDF via the Android share sheet.
  # See docs/adr/0030-client-side-range-scoped-export.md.
  pdf: ^3.11.1
  printing: ^5.13.3
  # share_plus 13 pulls win32 6, which forces package_info_plus to 10 and AGP
  # to 8.12.1 — the three move together or not at all. An earlier attempt at
  # this bump failed with `Unresolved reference 'ShareSuccessManager'`, which
  # was a stale generated registrant from the half-reverted attempt before it,
  # not an incompatibility; a `flutter clean` is what the error actually wanted.
  share_plus: ^13.3.0

  # Hands the "lupa password" request to the developer's WhatsApp (ADR-0059).
  url_launcher: ^6.3.1

  # Firebase — admin identity + eligibility gate (Android only). See
  # docs/adr/0015-firebase-admin-auth-and-server-kill-switch.md.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  # Fleet super-admin control plane: privileged mutations via callables. See
  # docs/adr/0016-fleet-superadmin-cloud-control-plane.md.
  cloud_functions: ^5.1.3
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0

  # The update gate (ADR-0087). package_info_plus supplies this build's own
  # versionName — the value the gate compares against and the `ver` the mDNS TXT
  # record advertises. open_filex hands the downloaded APK to Android's package
  # installer; it ships its own FileProvider, so there is no authority to
  # declare here.
  package_info_plus: ^10.2.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.2 # test/bundled_fonts_test.dart reads the font manifest

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  drift_dev: ^2.34.0

  # App launcher icon generation
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # ARB → AppLocalizations, per l10n.yaml. ADR-0083.
  generate: true
  assets:
    - assets/sounds/
    # The [[Pesan mandiri]] guest page (ADR-0105). Served off the cleartext
    # plane by reading it out of the bundle — an APK has no filesystem for a
    # static handler to walk.
    - assets/guest_web/

  # Every face every skin can reach, so the app never needs the network to draw
  # a correct first frame — which is the whole promise. Archivo serves `glow`
  # (the default theme's skin, ADR-0057) and brutal's body copy; Archivo Black +
  # DM Mono serve the rest of `brutal`; IBM Plex serves the amber (`lembut`)
  # themes. There is no longer a `google_fonts` fallback behind any of them.
  # ponytail: no italics shipped — the two in-app italic spots synthesise.
  fonts:
    # One variable file spans Thin–Black; the weight axis is driven by
    # FontVariation in SatType rather than by per-weight `asset:` entries.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    # Single-weight face by design — SatType.display() never passes a weight
    # under brutal, so there is nothing here for Flutter to synthesise.
    - family: Archivo Black
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    # DM Mono stops at Medium. The ramp asks for w600/w700 in places; Flutter
    # snaps those to 500, which is what google_fonts resolved to as well.
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 300
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

# App launcher icon — generate via: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 29
  adaptive_icon_background: "#EE8F3B"
  adaptive_icon_foreground: "assets/icon/icon.png"

