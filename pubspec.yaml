name: satset
description: "SatSet — Solusi Cepat, Kerja Akurat. Internal ordering ecosystem."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.0
  path: ^1.9.0

  # Models / codegen runtime
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persistence (server-side)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4

  # LAN transport
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Storage / prefs
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Discovery / pairing
  bonsoir: ^5.1.10
  mobile_scanner: ^5.2.3

  # TLS / JWT / crypto
  basic_utils: ^5.7.0
  dart_jsonwebtoken: ^2.14.1
  crypto: ^3.0.5

  # Logging
  logging: ^1.2.0

  # Audio alerts
  audioplayers: ^6.1.0
  image_picker: ^1.2.2

  # Firebase — admin identity + eligibility gate (Android only). See
  # docs/adr/0015-firebase-admin-auth-and-server-kill-switch.md.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Fleet super-admin control plane: privileged mutations via callables. See
  # docs/adr/0016-fleet-superadmin-cloud-control-plane.md.
  cloud_functions: ^5.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

  # Native integration testing
  patrol: ^4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

# Patrol native UI test config — driven by patrol_cli.
patrol:
  app_name: SatSet
  android:
    package_name: id.satset.satset
