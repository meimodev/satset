tags:
  # Pixel comparisons. Excluded from `flutter test` because golden output is
  # renderer- and platform-sensitive: a contributor on a different OS would see
  # failures that say nothing about their change. Run deliberately, on one
  # machine or one CI image:
  #
  #   flutter test --tags golden --run-skipped
  #   flutter test --tags golden --run-skipped --update-goldens
  #
  # `--run-skipped` is needed because a skip is how a tag gets excluded from
  # the default run; there is no default-exclude in dart_test.yaml.
  golden:
    skip: "run explicitly: flutter test --tags golden --run-skipped"

  # Timing measurements against a real file-backed database. Excluded from
  # `flutter test` for the same reason goldens are: the number depends on the
  # machine, and a slow CI runner failing on a stopwatch says nothing about the
  # change. Run deliberately:
  #
  #   flutter test --tags bench --run-skipped
  bench:
    skip: "run explicitly: flutter test --tags bench --run-skipped"
