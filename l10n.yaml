# ADR-0083. Indonesian is the template: it is the language the copy was written
# in, and the one a new string is authored in.
arb-dir: lib/l10n
template-arb-file: app_id.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false

# gen-l10n only *warns* on a key missing from a locale, and a warning is how a
# half-translated release ships. test/arb_parity_test.dart fails instead.
untranslated-messages-file: build/untranslated_messages.txt
