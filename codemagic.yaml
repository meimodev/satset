# Codemagic CI — build a signed release APK on every `v*` tag, publish it to a
# public GitHub Release (that is the download host the website links to) and
# ship the same file to Firebase App Distribution (group: testers).
#
# The website links to the stable "latest" URL, which never changes:
#   https://github.com/meimodev/satset/releases/latest/download/satset.apk
# The versioned file (satset-1.0.1.apk) is attached to the same release, so old
# builds stay downloadable. Public repo → no auth on the download.
#
# One-time setup in the Codemagic UI before the first build:
#   1. Connect this GitHub repo, add the app.
#   2. Team settings → Code signing identities → Android keystores:
#        upload `android/app/upload-keystore.jks`, reference name
#        `satset_upload_keystore`, alias `upload`, with the keystore + key
#        passwords. Codemagic then injects CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD
#        / CM_KEY_ALIAS / CM_KEY_PASSWORD at build time.
#   3. Environment variables group `firebase_credentials` (mark Secure):
#        FIREBASE_SERVICE_ACCOUNT = full JSON of a service account that has the
#        "Firebase App Distribution Admin" role on project satset-3a795. The
#        last step of this workflow also writes the release gate at
#        config/release_gate (ADR-0130), which needs datastore.entities.create
#        / .update — the project's `firebase-adminsdk` account already carries
#        both, via roles/firebase.sdkAdminServiceAgent, so a key generated from
#        the Firebase console needs nothing added. A hand-rolled account with
#        App Distribution alone does: grant it "Cloud Datastore User" or the
#        build ships the APK and then fails on the gate write.
#   4. Environment variables group `github_release` (mark Secure):
#        GH_TOKEN = fine-grained PAT on meimodev/satset with Contents: write.
#
# Trigger a build by pushing a tag, e.g. the /push-deploy skill's `v1.0.1`.

workflows:
  android-release-distribute:
    name: Android release → GitHub Release + Firebase App Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - satset_upload_keystore
      groups:
        - firebase_credentials   # provides FIREBASE_SERVICE_ACCOUNT
        - github_release         # provides GH_TOKEN
      vars:
        # New Firebase Android app (id.activid.satset).
        FIREBASE_APP_ID: "1:164691917298:android:3a4bcdd9dba54d1f4b536b"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Write key.properties from Codemagic keystore secrets
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Flutter pub get
        script: flutter pub get
      - name: Build signed release APK
        script: flutter build apk --release
      - name: Publish the APK to a public GitHub Release
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Tags carry an optional severity suffix that drives the in-app update
          # gate (ADR-0130): v1.0.2-recommended. It is not part of the version.
          VERSION="${CM_TAG#v}"
          VERSION="${VERSION%%-*}"
          # Two names for one file: the versioned copy is the archive, the plain
          # copy is what /releases/latest/download/satset.apk resolves to.
          cp "$APK" "satset-$VERSION.apk"
          cp "$APK" "satset.apk"
          gh release create "$CM_TAG" \
            --repo meimodev/satset \
            --title "SatSet $VERSION" \
            --generate-notes \
            "satset-$VERSION.apk" "satset.apk"
      # LAST step, deliberately. Raising the floor before the APK is published
      # points every device in the fleet at a download that does not exist yet,
      # and nothing inside the app recovers from that. See ADR-0130.
      - name: Publish the release gate
        script: node tool/publish_release_gate.mjs "$CM_TAG"
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID
          groups:
            - testers
